<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340">
  <defs>
    <style>
      .box { fill: hsl(240, 2%, 18%); stroke: hsl(0, 0%, 35%); stroke-width: 1.5; rx: 6; }
      .title { fill: hsl(45, 100%, 72%); font: 600 11px 'Segoe UI', sans-serif; }
      .attr { fill: hsl(0, 0%, 88%); font: 10px 'Segoe UI', sans-serif; }
      .line { stroke: hsl(0, 0%, 45%); stroke-width: 1; fill: none; }
      .card { stroke: hsl(45, 100%, 72%); stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="520" height="340" fill="hsl(240, 2%, 13%)"/>
  <!-- Patient -->
  <rect class="box" x="20" y="20" width="120" height="100"/>
  <text class="title" x="30" y="38">Patient</text>
  <text class="attr" x="28" y="54">Identifiant (PK)</text>
  <text class="attr" x="28" y="66">Nom, Prénom</text>
  <text class="attr" x="28" y="78">Age, Sexe</text>
  <text class="attr" x="28" y="90">Pathologie</text>
  <text class="attr" x="28" y="102">CoteNeglige</text>
  <!-- Experience -->
  <rect class="box" x="180" y="20" width="120" height="88"/>
  <text class="title" x="190" y="38">Experience</text>
  <text class="attr" x="188" y="54">IdEnvironnement</text>
  <text class="attr" x="188" y="66">Type (ouvert/fermé)</text>
  <text class="attr" x="188" y="78">Positions[]</text>
  <text class="attr" x="188" y="90">StartPositions</text>
  <text class="attr" x="188" y="102">Difficultes</text>
  <!-- Position -->
  <rect class="box" x="340" y="20" width="120" height="88"/>
  <text class="title" x="350" y="38">Position</text>
  <text class="attr" x="348" y="54">IdPosition</text>
  <text class="attr" x="348" y="66">Coordinates (x,y,z)</text>
  <text class="attr" x="348" y="78">Description</text>
  <text class="attr" x="348" y="90">DifficulteParPosition</text>
  <!-- Session -->
  <rect class="box" x="20" y="160" width="140" height="100"/>
  <text class="title" x="30" y="178">Session</text>
  <text class="attr" x="28" y="194">IdSession (PK)</text>
  <text class="attr" x="28" y="206">IdPatient (FK)</text>
  <text class="attr" x="28" y="218">IdSuperviseur (FK)</text>
  <text class="attr" x="28" y="230">DateDebut, DateFin</text>
  <text class="attr" x="28" y="242">EnvironnementUtilise</text>
  <text class="attr" x="28" y="254">Resultats</text>
  <!-- Superviseur -->
  <rect class="box" x="200" y="160" width="120" height="72"/>
  <text class="title" x="210" y="178">Superviseur</text>
  <text class="attr" x="208" y="194">IdSuperviseur (PK)</text>
  <text class="attr" x="208" y="206">Nom, Prénom</text>
  <text class="attr" x="208" y="218">Fonction</text>
  <!-- Observation -->
  <rect class="box" x="360" y="160" width="100" height="58"/>
  <text class="title" x="370" y="178">Observation</text>
  <text class="attr" x="368" y="194">clinique</text>
  <text class="attr" x="368" y="206">(lié Patient)</text>
  <!-- Storage layer -->
  <rect class="box card" x="20" y="270" width="440" height="56"/>
  <text class="title" x="30" y="288">Couche stockage (C#)</text>
  <text class="attr" x="28" y="304">PatientsManager, SuperviseursManager, SessionsManager · JSON (Data/*.json) · PatientDatabase (modèle riche)</text>
  <!-- Relations -->
  <path class="line" d="M 140 70 L 175 65"/>
  <text class="attr" x="148" y="62" font-size="9">1,n</text>
  <path class="line" d="M 300 65 L 335 65"/>
  <text class="attr" x="308" y="62" font-size="9">1,n</text>
  <path class="line" d="M 80 120 L 80 155"/>
  <path class="line" d="M 90 160 L 90 155"/>
  <text class="attr" x="70" y="142" font-size="9">1,n Session</text>
  <path class="line" d="M 260 196 L 315 196"/>
  <text class="attr" x="272" y="192" font-size="9">n,1</text>
  <path class="line" d="M 140 210 L 195 210"/>
  <text class="attr" x="158" y="206" font-size="9">n,1</text>
  <text fill="hsl(0,0%,60%)" font-size="9" x="30" y="328">HospitalData  Modèle de données (patients, expériences VR/RA, sessions, superviseurs)</text>
</svg>
